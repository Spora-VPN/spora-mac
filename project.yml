name: Spora
options:
  bundleIdPrefix: to.spora.macos
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    # The version (bumped by hand in the commit a release tags). A release's
    # build number is the commit count (scripts/release.sh), a dev build's
    # the time (scripts/dev.sh --direct).
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # No team here: scripts/dev.sh builds unsigned unless DEVELOPMENT_TEAM
    # names one. The NetworkExtension packet-tunnel appex needs a paid team;
    # with one, automatic signing + `-allowProvisioningUpdates` makes the
    # profiles for the to.spora.macos / to.spora.macos.tunnel App IDs.
    CODE_SIGN_STYLE: Automatic
    # The app group the app and the tunnel extension share (connection
    # records and the diagnostic log live in its container; see SporaPaths).
    # macOS team-prefixed form: no portal registration needed. Without a
    # team it has no prefix, and SporaPaths keeps to Application Support.
    SPORA_APP_GROUP: $(DEVELOPMENT_TEAM).to.spora.macos
    # The UniFFI-generated C module (spora_ffiFFI): a modulemap + header here,
    # the Rust staticlib (linked into SporaKit) provides its symbols. SporaKit's
    # interface imports it, so every target that imports SporaKit needs it too
    # (explicit module builds resolve it per target: Xcode 27 fails without).
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/rust-out/include

packages:
  # The direct build's updater (ADR-002 D4); the App Store build never links
  # it. An exact version: the package pins the binary framework's checksum.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

targets:
  SporaDesign:
    type: framework
    platform: macOS
    sources:
      - path: Packages/SporaDesign/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.spora.macos.SporaDesign
        DEFINES_MODULE: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        SKIP_INSTALL: "NO"

  SporaKit:
    type: framework
    platform: macOS
    sources:
      - path: Packages/SporaKit/Sources
      # Generated UniFFI Swift bindings (from ../spora/build-ffi-apple.sh).
      - path: rust-out/Sources/SporaFFI/spora_ffi.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.spora.macos.SporaKit
        DEFINES_MODULE: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        SKIP_INSTALL: "NO"
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/rust-out/lib
        OTHER_LDFLAGS: -lspora_ffi -lresolv
    dependencies:
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: Network.framework

  SporaKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Packages/SporaKit/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.spora.macos.SporaKitTests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: SporaKit

  # The App Store build (and the day-to-day dev build): the tunnel as an app
  # extension in Contents/PlugIns. App extensions are App Store only on macOS
  # (TN3134), so the spora.to download is SporaDirect below.
  Spora:
    templates: [SporaApp]
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: "NO"
        CODE_SIGN_ENTITLEMENTS: App/Spora.entitlements
    dependencies:
      - target: SporaTunnelExt
        embed: true   # into Contents/PlugIns

  # The direct download from spora.to (ADR-002): Developer ID signed and
  # notarized, the tunnel as a system extension in
  # Contents/Library/SystemExtensions, activated on the first connect
  # (`SPORA_DIRECT`). Same bundle ids as the App Store build; the two are
  # never installed together.
  SporaDirect:
    templates: [SporaApp]
    settings:
      base:
        PRODUCT_NAME: Spora
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_ENTITLEMENTS: App/SporaDirect.entitlements
        # App/Info.plist plus Sparkle's keys (SUFeedURL, SUPublicEDKey):
        # keep the two in step.
        INFOPLIST_FILE: App/SporaDirect-Info.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SPORA_DIRECT
        # Developer ID builds sign by hand (scripts/dev.sh --direct): the
        # profile's name comes from the environment, never the repo.
        PROVISIONING_PROFILE_SPECIFIER: $(SPORA_PROFILE_APP)
      configs:
        # Sparkle's appcast (SUFeedURL). A debug build never asks production:
        # by default an address that answers nothing, like dev.sh's
        # SPORA_API; a local test feed is passed at build time
        # (SPORA_UPDATE_FEED=http://…).
        Debug:
          SPORA_UPDATE_FEED: http://127.0.0.1:9/appcast.xml
        Release:
          SPORA_UPDATE_FEED: https://spora.to/updates/macos/appcast.xml
    dependencies:
      - target: SporaTunnelSysExt
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Library/SystemExtensions
      - package: Sparkle
    postBuildScripts:
      # Xcode signs the Sparkle.framework it embeds, but not the executables
      # inside it, and notarization wants each one signed with the app's
      # identity, the hardened runtime and a secure timestamp. This runs
      # before Xcode signs the app, so the app's seal covers the result.
      # Unsigned builds skip it.
      - name: Sign Sparkle's helpers
        basedOnDependencyAnalysis: false
        script: |
          [ "$CODE_SIGNING_ALLOWED" = YES ] && [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ] || exit 0
          fw="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/Sparkle.framework"
          sign() { codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime --timestamp "$@"; }
          for xpc in "$fw"/Versions/B/XPCServices/*.xpc; do
            sign --preserve-metadata=entitlements "$xpc"
          done
          sign "$fw/Versions/B/Autoupdate" "$fw/Versions/B/Updater.app"
          sign "$fw"

  # NetworkExtension packet-tunnel app extension (connect/use side). Stays a thin
  # sandboxed shim (ADR): it locates the utun fd and hands a dup to Rust's
  # connect_utun(); all tunnel logic lives in the Rust core.
  SporaTunnelExt:
    type: app-extension
    platform: macOS
    sources:
      - path: Tunnel
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.spora.macos.tunnel
        INFOPLIST_FILE: Tunnel/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"
        CODE_SIGN_ENTITLEMENTS: Tunnel/SporaTunnelExt.entitlements
        # Load SporaKit from the host app's Frameworks dir at runtime (the appex
        # lives at Spora.app/Contents/PlugIns/SporaTunnelExt.appex).
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../../../../Frameworks"
    dependencies:
      - target: SporaKit
        embed: false   # shared with the host app via rpath
        link: true
      - sdk: NetworkExtension.framework
      - sdk: SystemConfiguration.framework

  # The same provider packaged as a system extension (SporaDirect). sysextd runs
  # a copy from /Library/SystemExtensions as root, out of the host app's reach,
  # so it carries its own SporaKit. The bundle is named after its identifier,
  # where OSSystemExtensionRequest looks for it.
  SporaTunnelSysExt:
    type: system-extension
    platform: macOS
    sources:
      - path: Tunnel
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: TunnelSystemExtension
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: to.spora.macos.tunnel
        PRODUCT_MODULE_NAME: SporaTunnel
        PRODUCT_BUNDLE_IDENTIFIER: to.spora.macos.tunnel
        INFOPLIST_FILE: TunnelSystemExtension/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_ENTITLEMENTS: TunnelSystemExtension/SporaTunnelSysExt.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(SPORA_PROFILE_TUNNEL)
        SKIP_INSTALL: "YES"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
    dependencies:
      - target: SporaKit
        embed: true    # into the extension's own Contents/Frameworks
      - sdk: NetworkExtension.framework
      - sdk: SystemConfiguration.framework

targetTemplates:
  # What both app builds share: everything but the tunnel's packaging, its
  # entitlements and the hardened runtime.
  SporaApp:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "*Info.plist"
          - "*.entitlements"
          - "Resources/Fonts"
      # Folder reference so the IBM Plex TTFs land in Resources/Fonts/ (intact
      # subdir), matching ATSApplicationFontsPath. SporaDesign also registers
      # them programmatically at launch as a backstop.
      - path: App/Resources/Fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.spora.macos
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        COMBINE_HIDPI_IMAGES: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Fonts bundled in Resources are registered via ATSApplicationFontsPath.
    dependencies:
      - target: SporaKit
        embed: true
      - target: SporaDesign
        embed: true

schemes:
  Spora:
    build:
      targets:
        Spora: all
        SporaKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SporaKitTests
  # The direct download's build (unsigned unless scripts/dev.sh --direct signs
  # it with Developer ID).
  SporaDirect:
    build:
      targets:
        SporaDirect: all
    run:
      config: Debug
