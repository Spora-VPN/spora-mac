name: Spora
options:
  bundleIdPrefix: to.spora.macos
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # No team here: scripts/dev.sh builds unsigned unless DEVELOPMENT_TEAM
    # names one. The NetworkExtension packet-tunnel appex needs a paid team;
    # with one, automatic signing + `-allowProvisioningUpdates` makes the
    # profiles for the to.spora.macos / to.spora.macos.tunnel App IDs.
    CODE_SIGN_STYLE: Automatic
    # The app group the app and the tunnel extension share (connection
    # records and the diagnostic log live in its container; see SporaPaths).
    # macOS team-prefixed form: no portal registration needed. Without a
    # team it has no prefix, and SporaPaths keeps to Application Support.
    SPORA_APP_GROUP: $(DEVELOPMENT_TEAM).to.spora.macos
    # The UniFFI-generated C module (spora_ffiFFI): a modulemap + header here,
    # the Rust staticlib (linked into SporaKit) provides its symbols. SporaKit's
    # interface imports it, so every target that imports SporaKit needs it too
    # (explicit module builds resolve it per target: Xcode 27 fails without).
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/rust-out/include

targets:
  SporaDesign:
    type: framework
    platform: macOS
    sources:
      - path: Packages/SporaDesign/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.spora.macos.SporaDesign
        DEFINES_MODULE: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        SKIP_INSTALL: "NO"

  SporaKit:
    type: framework
    platform: macOS
    sources:
      - path: Packages/SporaKit/Sources
      # Generated UniFFI Swift bindings (from ../spora/build-ffi-apple.sh).
      - path: rust-out/Sources/SporaFFI/spora_ffi.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.spora.macos.SporaKit
        DEFINES_MODULE: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        SKIP_INSTALL: "NO"
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/rust-out/lib
        OTHER_LDFLAGS: -lspora_ffi -lresolv
    dependencies:
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: Network.framework

  SporaKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Packages/SporaKit/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.spora.macos.SporaKitTests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: SporaKit

  Spora:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "Resources/Fonts"
      # Folder reference so the IBM Plex TTFs land in Resources/Fonts/ (intact
      # subdir), matching ATSApplicationFontsPath. SporaDesign also registers
      # them programmatically at launch as a backstop.
      - path: App/Resources/Fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.spora.macos
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"
        COMBINE_HIDPI_IMAGES: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Spora.entitlements
        # Fonts bundled in Resources are registered via ATSApplicationFontsPath.
    dependencies:
      - target: SporaKit
        embed: true
      - target: SporaDesign
        embed: true
      - target: SporaTunnelExt
        embed: true   # into Contents/PlugIns

  # NetworkExtension packet-tunnel app extension (connect/use side). Stays a thin
  # sandboxed shim (ADR): it locates the utun fd and hands a dup to Rust's
  # connect_utun(); all tunnel logic lives in the Rust core.
  SporaTunnelExt:
    type: app-extension
    platform: macOS
    sources:
      - path: Tunnel
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.spora.macos.tunnel
        INFOPLIST_FILE: Tunnel/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"
        CODE_SIGN_ENTITLEMENTS: Tunnel/SporaTunnelExt.entitlements
        # Load SporaKit from the host app's Frameworks dir at runtime (the appex
        # lives at Spora.app/Contents/PlugIns/SporaTunnelExt.appex).
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../../../../Frameworks"
    dependencies:
      - target: SporaKit
        embed: false   # shared with the host app via rpath
        link: true
      - sdk: NetworkExtension.framework
      - sdk: SystemConfiguration.framework

schemes:
  Spora:
    build:
      targets:
        Spora: all
        SporaKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SporaKitTests
